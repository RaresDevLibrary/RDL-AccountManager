name: Build unsigned release candidate
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and package
        shell: pwsh
        run: ./build.ps1
      - name: Upload unsigned build for review
        uses: actions/upload-artifact@v4
        with:
          name: RDL-AccountManager-unsigned
          path: dist/RDL-AccountManager
          if-no-files-found: error
